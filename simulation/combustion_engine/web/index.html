<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combustion Engine · fmesh</title>
<style>
  :root {
    --bg: #101317; --panel: #181d23; --line: #2a323c; --text: #e6e9ee; --muted: #8b95a3;
    --accent: #ffb547; --ok: #4fd18b; --warn: #ffb547; --bad: #ff5d5d; --cold: #4aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px 6px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); }
  #status { margin-left: auto; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  main { padding: 0 16px 16px; max-width: 1400px; margin: 0 auto; }
  canvas { display: block; width: 100%; aspect-ratio: 1280 / 860; background: #0c0f13; border: 1px solid var(--line); border-radius: 10px; touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
  button:hover { border-color: #3d4856; }
  button.on { background: #2a2414; border-color: var(--accent); color: var(--accent); }
  button.start { min-width: 120px; font-weight: 700; }
  button.start.running { background: #2b1616; border-color: var(--bad); color: #ffb0b0; }
  button.gas { min-width: 110px; }
  button.gas.held { background: #1a2b1f; border-color: var(--ok); color: var(--ok); }
  kbd { font: 12px ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: #0c0f13; color: var(--muted); margin-right: 4px; }
  label.hand { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  .group { display: flex; gap: 6px; align-items: center; }
  .sep { width: 1px; height: 28px; background: var(--line); margin: 0 4px; }
  footer { color: var(--muted); margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Combustion Engine</h1>
  <span class="sub" id="sub">every part is an fmesh component; every stroke is one trip around the mesh</span>
  <span id="status">connecting…</span>
</header>
<main>
  <canvas id="c" width="1280" height="860"></canvas>
  <div class="controls">
    <button id="start" class="start"><kbd>I</kbd>Start</button>
    <button id="gas" class="gas"><kbd>↑</kbd><kbd>W</kbd>Gas</button>
    <button id="floor" class="gas"><kbd>Space</kbd>Floor it</button>
    <label class="hand">Hand throttle <input id="hand" type="range" min="0" max="100" value="0"></label>
    <span class="sep"></span>
    <button id="ac"><kbd>A</kbd>A/C</button>
    <button id="lights"><kbd>L</kbd>Lights</button>
    <button id="refuel"><kbd>F</kbd>Refuel</button>
    <span class="sep"></span>
    <span class="group">
      <button data-scale="1"><kbd>1</kbd>Real time</button>
      <button data-scale="0.25"><kbd>2</kbd>¼ speed</button>
      <button data-scale="0.04"><kbd>3</kbd>Slow motion</button>
    </span>
    <button id="sound"><kbd>M</kbd>Sound</button>
  </div>
  <footer>Hold <kbd>↑</kbd>/<kbd>W</kbd> to press the pedal, <kbd>↓</kbd>/<kbd>S</kbd> to lift off faster; it springs back when you let go. The hand throttle stays where you leave it.</footer>
</main>
<script>
"use strict";
// The page only draws: every number below comes from a part's own state in
// the mesh, streamed from /events. What the driver does goes to /control.

const W = 1280, H = 860;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let snap = null, snapAt = 0;
let dispAngle = null; // crank angle being drawn, in degrees
let lastFrame = performance.now();
const spin = {}; // visual rotation of pulleys, fan, gears

// ---------- talking to the engine ----------
function send(body) {
  fetch("/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
}
function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => {
    snap = JSON.parse(e.data); snapAt = performance.now(); updateButtons();
    document.getElementById("sub").textContent = `${Object.keys(snap.parts).length} parts, one fmesh component each: every stroke is one trip around the mesh`;
  };
  es.onerror = () => { document.getElementById("status").textContent = "reconnecting…"; };
}
connect();

// ---------- the driver ----------
let foot = 0, hand = 0, footUp = false, footDown = false, floored = false, lastSent = -1, sentAt = 0;
function pedal() { return floored ? 1 : Math.max(foot, hand); }
function tickPedal(dt) {
  if (footUp) foot = Math.min(1, foot + 1.1 * dt);
  else foot = Math.max(0, foot - (footDown ? 4 : 1.6) * dt);
  const p = Math.round(pedal() * 100) / 100, now = performance.now();
  if (p !== lastSent && now - sentAt > 40) { lastSent = p; sentAt = now; send({ pedal: p }); }
}
const P = (s, k, d) => (snap && snap.parts[s] && snap.parts[s][k] !== undefined) ? snap.parts[s][k] : d;
function running() { return snap && snap.running; }
function toggleStart() { send({ ignition: !(snap && snap.driver.ignition) }); }
function toggle(k) { if (snap) send({ [k]: !snap.driver[k] }); }
function setScale(s) { send({ scale: s }); }

const keys = {
  ArrowUp: (d) => footUp = d, KeyW: (d) => footUp = d,
  ArrowDown: (d) => footDown = d, KeyS: (d) => footDown = d,
  Space: (d) => floored = d,
};
const presses = {
  KeyI: toggleStart, KeyA: () => toggle("ac"), KeyL: () => toggle("lights"), KeyF: () => send({ refuel: true }),
  Digit1: () => setScale(1), Digit2: () => setScale(0.25), Digit3: () => setScale(0.04), KeyM: toggleSound,
};
addEventListener("keydown", (e) => {
  if (keys[e.code]) { keys[e.code](true); e.preventDefault(); }
  else if (presses[e.code] && !e.repeat) { presses[e.code](); e.preventDefault(); }
});
addEventListener("keyup", (e) => { if (keys[e.code]) { keys[e.code](false); e.preventDefault(); } });
addEventListener("blur", () => { footUp = footDown = floored = false; });

function hold(id, set) {
  const b = document.getElementById(id);
  const on = (e) => { e.preventDefault(); set(true); b.classList.add("held"); b.setPointerCapture?.(e.pointerId); };
  const off = () => { set(false); b.classList.remove("held"); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off);
}
hold("gas", (d) => footUp = d);
hold("floor", (d) => floored = d);
document.getElementById("hand").addEventListener("input", (e) => { hand = e.target.value / 100; });
document.getElementById("start").onclick = toggleStart;
document.getElementById("ac").onclick = () => toggle("ac");
document.getElementById("lights").onclick = () => toggle("lights");
document.getElementById("refuel").onclick = () => send({ refuel: true });
document.getElementById("sound").onclick = toggleSound;
document.querySelectorAll("[data-scale]").forEach((b) => b.onclick = () => setScale(+b.dataset.scale));

function updateButtons() {
  const s = snap, st = document.getElementById("status");
  const mode = s.running ? P("ecu", "mode", "off") : "stopped";
  st.textContent = s.running ? `${mode} · ${Math.round(P("crankshaft", "crank", {}).rpm || 0)} rpm` : `stopped: ${s.reason}`;
  st.style.color = { running: "var(--ok)", cranking: "var(--warn)", "rev limit": "var(--warn)", overheat: "var(--bad)" }[mode] || "var(--text)";
  const start = document.getElementById("start");
  start.classList.toggle("running", s.driver.ignition);
  start.lastChild.textContent = s.driver.ignition ? "Stop" : "Start";
  document.getElementById("ac").classList.toggle("on", s.driver.ac);
  document.getElementById("lights").classList.toggle("on", s.driver.lights);
  document.getElementById("refuel").classList.toggle("on", s.driver.refuel);
  document.querySelectorAll("[data-scale]").forEach((b) => b.classList.toggle("on", Math.abs(+b.dataset.scale - s.scale) < 1e-6));
}

// ---------- sound: a sawtooth at the firing frequency ----------
let audio = null;
function toggleSound() {
  const b = document.getElementById("sound");
  if (audio) { audio.ctx.close(); audio = null; b.classList.remove("on"); return; }
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o1.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; g.gain.value = 0;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination); o1.start(); o2.start();
  audio = { ctx: ac, o1, o2, f, g }; b.classList.add("on");
}
function tickSound() {
  if (!audio || !snap) return;
  const rpm = (P("crankshaft", "crank", {}).rpm || 0) * snap.scale, t = audio.ctx.currentTime;
  const firing = running() && ["running", "rev limit", "overheat"].includes(P("ecu", "mode", ""));
  const hz = Math.max(20, rpm / 60 * 2);
  audio.o1.frequency.setTargetAtTime(hz, t, 0.03);
  audio.o2.frequency.setTargetAtTime(hz / 2, t, 0.03);
  audio.f.frequency.setTargetAtTime(200 + 1800 * P("throttle-body", "opening", 0), t, 0.05);
  audio.g.gain.setTargetAtTime(running() && rpm > 30 ? (firing ? 0.05 + 0.08 * pedal() : 0.03) : 0, t, 0.05);
}

// ---------- drawing helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mix(c1, c2, t) { t = clamp(t, 0, 1); return `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], t))).join(",")})`; }
// Coolant and metal colors: blue when cold, green when warm, red when hot.
function tempColor(t) {
  if (t < 60) return mix([60, 130, 255], [70, 200, 150], (t - 20) / 40);
  if (t < 100) return mix([70, 200, 150], [255, 190, 60], (t - 70) / 30);
  return mix([255, 190, 60], [255, 60, 60], (t - 100) / 15);
}
function heatColor(t) { // exhaust: black → dull red → orange → yellow
  if (t < 300) return mix([60, 62, 66], [110, 40, 30], (t - 20) / 280);
  if (t < 600) return mix([110, 40, 30], [235, 80, 30], (t - 300) / 300);
  return mix([235, 80, 30], [255, 210, 90], (t - 600) / 300);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, o = {}) {
  ctx.font = `${o.weight || 500} ${o.size || 12}px system-ui, sans-serif`;
  ctx.fillStyle = o.color || "#8b95a3"; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function label(s, x, y, o = {}) {
  s = s.toUpperCase();
  ctx.font = "700 10px system-ui, sans-serif";
  const w = ctx.measureText(s).width, x0 = o.align === "center" ? x - w / 2 : x;
  ctx.fillStyle = "rgba(12,15,19,.78)"; rr(x0 - 4, y - 10, w + 8, 14, 4); ctx.fill();
  text(s, x, y, { size: 10, weight: 700, color: "#6b7583", ...o });
}
function pipe(points, width, color, dash, offset) {
  ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = "#0a0c0f"; ctx.lineWidth = width + 4; ctx.beginPath();
  points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = -offset; ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = Math.max(1.5, width / 3); ctx.stroke(); }
  ctx.restore();
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("ALPHA", a)); g.addColorStop(1, color.replace("ALPHA", 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function wheel(x, y, r, angle, o = {}) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = o.fill || "#2b333d"; ctx.strokeStyle = o.rim || "#4b5664"; ctx.lineWidth = o.lw || 3;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.rotate(angle); ctx.strokeStyle = o.spoke || "#6d7988"; ctx.lineWidth = 2;
  for (let i = 0; i < (o.spokes || 3); i++) { ctx.rotate(Math.PI * 2 / (o.spokes || 3)); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * .8, 0); ctx.stroke(); }
  ctx.fillStyle = o.hub || "#8b95a3"; ctx.beginPath(); ctx.arc(0, 0, r * .18, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- the crank angle being drawn ----------
// The engine sends a snapshot every few strokes; between them the drawing
// runs on at the engine's speed, but never faster than the eye can follow:
// above that it skips whole cycles (720°), which look the same, so the
// pistons, valves and sparks always stay in step with each other.
const MAX_VISUAL_RPM = 720;
function advanceAngle(dt) {
  const crank = P("crankshaft", "crank", { stroke: 0, rpm: 0 });
  const rpm = crank.rpm * (snap ? snap.scale : 1);
  const since = (performance.now() - snapAt) / 1000;
  // The parts' states are those of the stroke before the one just announced.
  const target = Math.max(0, crank.stroke - 1) * 180 + (running() ? Math.min(179, since * rpm * 6) : 0);
  if (dispAngle === null || dispAngle > target + 1) dispAngle = target;
  if (target - dispAngle > 720) dispAngle += Math.floor((target - dispAngle) / 720) * 720;
  dispAngle += Math.min(target - dispAngle, Math.max(MAX_VISUAL_RPM * 6 * dt, (target - dispAngle) * 0.0));
  const visualRpm = Math.min(rpm, MAX_VISUAL_RPM);
  return { stroke: Math.floor(dispAngle / 180), f: (dispAngle % 180) / 180, rpm: crank.rpm, visualRpm };
}
function phaseOf(i, n) { // the same rule as phase() in common.go
  const idx = snap.firingOrder.indexOf(i);
  return (2 - idx + 4 + (n % 4)) % 4;
}

// ---------- the engine, cut open ----------
const CYL_X = [0, 250, 380, 510, 640], BORE = 92;
const HEAD_Y = 118, CRANK_Y = 430, CRANK_R = 52, ROD = 190;
function pistonY(theta) { return CRANK_Y - (CRANK_R * Math.cos(theta) + Math.sqrt(ROD * ROD - (CRANK_R * Math.sin(theta)) ** 2)); }

function drawEngine(a) {
  const blockT = P("engine-block", "temp", 20), map = P("intake-manifold", "map", 1);
  const exT = P("exhaust-manifold", "temp", 20), opening = P("throttle-body", "opening", 0);
  const injecting = P("fuel-rail", "injecting", 0), railP = P("fuel-rail", "pressure", 0);
  const ignOn = (P("fuse-box", "on", {}) || {}).ignition;

  // Block and head, with the water jacket's color showing the coolant temperature.
  rr(170, 92, 550, 270, 14); ctx.fillStyle = "#1d232b"; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = tempColor(blockT); ctx.globalAlpha = .55; ctx.stroke(); ctx.globalAlpha = 1;
  rr(160, 60, 570, 52, 10); ctx.fillStyle = "#252c35"; ctx.fill();

  // Intake plenum over the top, throttle body and air filter at the left.
  const airCol = `rgba(90,170,255,${0.25 + 0.6 * map})`;
  pipe([[96, 34], [700, 34]], 20, airCol, [6, 14], dispAngle * 0.4 * map);
  for (let i = 1; i <= 4; i++) pipe([[CYL_X[i] - 50, 34], [CYL_X[i] - 50, 70], [CYL_X[i] - 26, 104]], 12, airCol);
  label("intake manifold · " + (map * 100).toFixed(0) + " kPa", 330, 20, { color: "#7fb6ff" });
  rr(20, 14, 58, 42, 8); ctx.fillStyle = "#2a3139"; ctx.fill();
  for (let k = 0; k < 6; k++) { ctx.fillStyle = "#3c4652"; ctx.fillRect(26 + k * 8, 20, 4, 30); }
  label("air filter", 22, 70);
  ctx.save(); ctx.translate(96, 34); ctx.strokeStyle = "#0a0c0f"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.stroke();
  ctx.rotate(-Math.PI / 2 + opening * Math.PI / 2); ctx.strokeStyle = "#ffb547"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(13, 0); ctx.stroke(); ctx.restore();
  label("throttle " + Math.round(opening * 100) + "%", 22, 86, { color: "#ffb547" });

  // Fuel rail along the intake side.
  pipe([[150, 88], [690, 88]], 6, railP > 2 ? "#d9c34a" : "#5a5530");

  // Exhaust headers to the collector on the right.
  const exCol = heatColor(exT);
  for (let i = 1; i <= 4; i++) pipe([[CYL_X[i] + 26, 104], [CYL_X[i] + 46, 76], [CYL_X[i] + 90, 60], [740, 60]], 12, exCol);
  pipe([[740, 60], [760, 100], [760, 520]], 18, exCol);
  if (exT > 350) glow(760, 120, 60, "rgba(255,110,40,ALPHA)", clamp((exT - 350) / 600, 0, .5));
  label("exhaust " + exT.toFixed(0) + "°C", 700, 548, { color: exCol });
  const lam = P("lambda-sensor", "lambda", 0), ready = P("lambda-sensor", "ready", false);
  ctx.fillStyle = ready ? "#4fd18b" : "#555"; ctx.beginPath(); ctx.arc(760, 200, 7, 0, 7); ctx.fill();
  text("λ " + (ready ? (lam > 1.5 ? "fuel cut" : lam.toFixed(2)) : "cold"), 796, 204, { color: ready ? "#4fd18b" : "#777", size: 12, weight: 700 });

  // The cylinders.
  for (let i = 1; i <= 4; i++) {
    const x = CYL_X[i], ph = phaseOf(i, a.stroke), f = a.f;
    const theta = Math.PI * ((ph % 2) + f);
    const py = pistonY(theta) - 34; // crown
    // bore
    ctx.fillStyle = "#11151a"; ctx.fillRect(x - BORE / 2, HEAD_Y, BORE, 232);
    // what is in the chamber
    const burn = P("cylinder-" + i, "burn", 0);
    let fill = null;
    if (ph === 0) fill = `rgba(110,170,255,${.15 + .35 * map * f})`;
    else if (ph === 1) fill = `rgba(120,180,255,${.3 + .3 * f})`;
    else if (ph === 2) fill = burn > 0 ? null : "rgba(120,180,255,.25)";
    else fill = `rgba(140,140,140,${.45 * (1 - f)})`;
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(x - BORE / 2, HEAD_Y, BORE, py - HEAD_Y); }
    if (ph === 2 && burn > 0) {
      const k = (1 - .55 * f) * clamp(.7 + burn * 2, .8, 1);
      const g = ctx.createLinearGradient(0, HEAD_Y, 0, py);
      g.addColorStop(0, `rgba(255,245,190,${k})`); g.addColorStop(.5, `rgba(255,150,40,${k})`); g.addColorStop(1, `rgba(220,70,20,${k * .8})`);
      ctx.fillStyle = g; ctx.fillRect(x - BORE / 2, HEAD_Y, BORE, py - HEAD_Y);
      if (f < .4) glow(x, HEAD_Y + 30, 80, "rgba(255,170,60,ALPHA)", .55 * (1 - f / .4));
    }
    // piston, pin and rod
    const pin = [x + CRANK_R * Math.sin(theta), CRANK_Y - CRANK_R * Math.cos(theta)];
    ctx.strokeStyle = "#7c8794"; ctx.lineWidth = 12; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, py + 34); ctx.lineTo(pin[0], pin[1]); ctx.stroke();
    const pg = ctx.createLinearGradient(x - BORE / 2, 0, x + BORE / 2, 0);
    pg.addColorStop(0, "#8d97a3"); pg.addColorStop(.5, "#c9d0d8"); pg.addColorStop(1, "#7d8793");
    rr(x - BORE / 2 + 3, py, BORE - 6, 52, 4); ctx.fillStyle = pg; ctx.fill();
    ctx.fillStyle = "#5d6773"; for (let r = 0; r < 3; r++) ctx.fillRect(x - BORE / 2 + 3, py + 7 + r * 7, BORE - 6, 2);
    ctx.fillStyle = "#3b434d"; ctx.beginPath(); ctx.arc(x, py + 34, 6, 0, 7); ctx.fill();
    // walls
    ctx.fillStyle = "#2c343e"; ctx.fillRect(x - BORE / 2 - 8, HEAD_Y, 8, 232); ctx.fillRect(x + BORE / 2, HEAD_Y, 8, 232);

    // valves: intake on the left, exhaust on the right, lifted by the cams
    const inLift = ph === 0 ? Math.sin(Math.PI * f) : 0, exLift = ph === 3 ? Math.sin(Math.PI * f) : 0;
    drawValve(x - 24, inLift, "#5aa8ff", dispAngle / 2 + i * 90);
    drawValve(x + 24, exLift, "#ff8a4a", dispAngle / 2 + i * 90 + 90);
    // spark plug
    ctx.fillStyle = "#ddd"; ctx.fillRect(x - 4, 58, 8, 22); ctx.fillStyle = "#9aa"; ctx.fillRect(x - 2, 80, 4, 40);
    if (ph === 2 && f < 0.15 && burn > 0 && ignOn) {
      glow(x, HEAD_Y + 4, 26, "rgba(170,210,255,ALPHA)", 1 - f / 0.15);
      ctx.strokeStyle = "#e9f3ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, HEAD_Y); ctx.lineTo(x + 3, HEAD_Y + 5); ctx.lineTo(x - 3, HEAD_Y + 8); ctx.lineTo(x + 6, HEAD_Y + 14); ctx.stroke();
    }
    // injector, spraying on its cylinder's intake stroke
    ctx.save(); ctx.translate(x - 50, 92); ctx.rotate(-0.5);
    ctx.fillStyle = "#b8a34a"; ctx.fillRect(-5, -10, 10, 20); ctx.restore();
    if (ph === 0 && f < .6 && railP > 2 && P("cylinder-" + i, "fuel", 0) + (injecting === i ? 1 : 0) > 0) {
      ctx.fillStyle = "rgba(255,225,90,.7)";
      for (let k = 0; k < 10; k++) { const s = (k * 37 + dispAngle * 3) % 30; ctx.beginPath(); ctx.arc(x - 45 + s * .7 + (k % 3) * 3, 102 + s * .5 + (k % 2) * 4, 1.6, 0, 7); ctx.fill(); }
    }
    label("cyl " + i, x, 344, { align: "center" });
  }

  // Crankshaft, counterweights and flywheel.
  ctx.strokeStyle = "#59636f"; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(170, CRANK_Y); ctx.lineTo(735, CRANK_Y); ctx.stroke();
  for (let i = 1; i <= 4; i++) {
    const x = CYL_X[i], ph = phaseOf(i, a.stroke), theta = Math.PI * ((ph % 2) + a.f);
    ctx.save(); ctx.translate(x, CRANK_Y); ctx.rotate(theta);
    ctx.fillStyle = "#3a434e"; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.arc(0, 0, 40, Math.PI * .15, Math.PI * .85); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6b7684"; ctx.fillRect(-12, -CRANK_R, 24, CRANK_R); ctx.beginPath(); ctx.arc(0, -CRANK_R, 10, 0, 7); ctx.fill();
    ctx.restore();
  }
  const crankRot = dispAngle * Math.PI / 180;
  // flywheel with the starter beside it
  ctx.save(); ctx.translate(140, CRANK_Y); ctx.rotate(crankRot);
  ctx.fillStyle = "#2d353f"; ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.fill();
  ctx.strokeStyle = "#5a6573"; ctx.lineWidth = 6; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(0, 0, 67, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#47515d"; for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.arc(36, 0, 9, 0, 7); ctx.fill(); }
  ctx.restore();
  label("flywheel", 112, 518);
  const engaged = P("starter", "engaged", false);
  rr(40, 470, 64, 34, 8); ctx.fillStyle = engaged ? "#3b3218" : "#262d35"; ctx.fill();
  ctx.strokeStyle = engaged ? "#ffb547" : "#3d4856"; ctx.lineWidth = 2; ctx.stroke();
  wheel(engaged ? 92 : 84, 487 - (engaged ? 6 : 0), 9, crankRot * 8, { rim: engaged ? "#ffb547" : "#4b5664", spokes: 4 });
  if (engaged) glow(72, 487, 40, "rgba(255,181,71,ALPHA)", .3);
  label("starter", 46, 520, { color: engaged ? "#ffb547" : undefined });

  // Oil sump with the pump.
  const oilP = P("oil-pump", "pressure", 0);
  rr(200, 470, 480, 54, 10); ctx.fillStyle = "#1a1f26"; ctx.fill();
  ctx.fillStyle = "#6b4f17"; rr(204, 494, 472, 26, 8); ctx.fill();
  wheel(440, 500, 14, crankRot, { fill: "#4e3c15", rim: "#b48a2c", spokes: 6 });
  pipe([[440, 486], [440, CRANK_Y + 10]], 4, oilP > 0.5 ? "#d4a640" : "#5c4a20", oilP > .5 ? [3, 6] : null, dispAngle * .5);
  label("oil pump · " + oilP.toFixed(1) + " bar", 462, 488, { color: "#d4a640" });

  // Fuel line from the tank, up past the exhaust to the rail.
  const pumpP = P("fuel-pump", "pressure", 0);
  pipe([[800, 610], [784, 610], [784, 96], [690, 88]], 3, pumpP > 2 ? "#d9c34a" : "#4a4628");
  label("fuel rail " + railP.toFixed(1) + " bar", 560, 100, { color: "#d9c34a" });
  label("water jacket " + blockT.toFixed(0) + "°C", 186, 376, { color: tempColor(blockT) });

  // Crank pulley at the front, driving the belt.
  wheel(735, CRANK_Y, 20, crankRot, { spokes: 3 });
}

function drawValve(x, lift, color, camDeg) {
  // cam lobe
  ctx.save(); ctx.translate(x, 46); ctx.rotate(camDeg * Math.PI / 180);
  ctx.fillStyle = "#4a5360"; ctx.beginPath(); ctx.ellipse(0, -2, 8, 11, 0, 0, 7); ctx.fill(); ctx.restore();
  const y = HEAD_Y + lift * 16;
  ctx.strokeStyle = "#9aa4b0"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, 58 + lift * 16); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = lift > .05 ? color : "#9aa4b0"; ctx.beginPath(); ctx.ellipse(x, y, 15, 4, 0, 0, 7); ctx.fill();
}

// ---------- belt, cooling and the electrics ----------
function drawFront(a, dt) {
  const vis = a.visualRpm, crankRpm = a.rpm;
  const turn = (key, ratio) => { spin[key] = ((spin[key] || 0) + ratio * vis / 60 * 2 * Math.PI * dt) % (2 * Math.PI); return spin[key]; };
  const C = [880, 460, 34], A = [840, 270, 22], Wp = [960, 330, 27], K = [1010, 470, 30], T = [905, 370, 12];
  const pulleys = [C, A, Wp, K];
  // belt: the convex hull around the pulleys
  const pts = [];
  pulleys.forEach(([x, y, r]) => { for (let k = 0; k < 32; k++) pts.push([x + (r + 4) * Math.cos(k / 32 * 2 * Math.PI), y + (r + 4) * Math.sin(k / 32 * 2 * Math.PI)]); });
  const hull = convexHull(pts); hull.push(hull[0]);
  spin.belt = ((spin.belt || 0) + vis / 60 * 2 * Math.PI * 34 * dt) % 1000;
  pipe(hull, 6, "#2b2b2b", [10, 8], spin.belt);
  label("accessory belt", 830, 540);

  const altA = P("alternator", "amps", 0);
  wheel(A[0], A[1], A[2], turn("alt", 2.8), { spokes: 5 });
  rr(A[0] - 52, A[1] - 36, 32, 72, 8); ctx.fillStyle = "#2a323c"; ctx.fill();
  label("alternator", A[0] - 60, A[1] - 44); text(altA.toFixed(0) + " A", A[0] - 50, A[1] + 52, { color: altA > 5 ? "#4fd18b" : "#8b95a3", weight: 700 });

  wheel(Wp[0], Wp[1], Wp[2], turn("wp", 1.1), { spokes: 6, spoke: "#4aa8ff" });
  label("water pump", Wp[0] - 30, Wp[1] - 36);
  wheel(T[0], T[1], T[2], turn("t", 2.6), { spokes: 2 });

  const acOn = P("ac-compressor", "engaged", false);
  wheel(K[0], K[1], K[2], acOn ? turn("ac", 1.3) : (spin.ac || 0), { spokes: 4, rim: acOn ? "#5fd4ff" : "#4b5664" });
  wheel(K[0], K[1], K[2] - 12, turn("acp", 1.3), { spokes: 3, fill: "#20262d" });
  if (acOn) glow(K[0], K[1], 50, "rgba(95,212,255,ALPHA)", .25);
  label("A/C compressor " + (acOn ? "on" : "off"), K[0] - 46, K[1] + 46, { color: acOn ? "#5fd4ff" : undefined });
  wheel(C[0], C[1], C[2], turn("crank", 1), { spokes: 3 });
  label("crank pulley", C[0] - 34, C[1] + 50);

  // Radiator, thermostat, hoses and fan.
  const blockT = P("engine-block", "temp", 20), opening = P("thermostat", "opening", 0), outT = P("radiator", "outlet", 20);
  const flow = P("water-pump", "flow", 0) * opening;
  spin.cool = ((spin.cool || 0) + flow * 120 * dt);
  pipe([[742, 120], [1000, 120], [1060, 90], [1110, 90]], 12, tempColor(blockT), flow > .02 ? [8, 10] : null, spin.cool);
  pipe([[1110, 380], [1040, 380], [990, 350], [Wp[0] + 10, Wp[1] + 20]], 12, tempColor(outT), flow > .02 ? [8, 10] : null, spin.cool);
  // thermostat on the upper hose
  ctx.save(); ctx.translate(1000, 120); ctx.fillStyle = "#2a323c"; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
  ctx.rotate(-Math.PI / 2 + opening * Math.PI / 2); ctx.strokeStyle = opening > 0 ? "#4fd18b" : "#8b95a3"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.restore();
  label("thermostat " + Math.round(opening * 100) + "%", 950, 104);
  // radiator core with a gradient from inlet to outlet
  const g = ctx.createLinearGradient(0, 70, 0, 400);
  g.addColorStop(0, tempColor(opening > 0 ? blockT : 20)); g.addColorStop(1, tempColor(outT));
  rr(1110, 70, 140, 330, 8); ctx.fillStyle = "#1a1f26"; ctx.fill();
  ctx.globalAlpha = .55; ctx.fillStyle = g; ctx.fillRect(1116, 76, 128, 318); ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; for (let y = 80; y < 394; y += 6) { ctx.beginPath(); ctx.moveTo(1116, y); ctx.lineTo(1244, y); ctx.stroke(); }
  label("radiator · " + P("radiator", "kw", 0).toFixed(1) + " kW", 1112, 62);
  // fan in front of it
  const fanSpeed = P("cooling-fan", "speed", 0);
  spin.fan = ((spin.fan || 0) + fanSpeed * 14 * dt) % (2 * Math.PI);
  ctx.save(); ctx.translate(1180, 235);
  ctx.strokeStyle = "#3d4856"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 66, 0, 7); ctx.stroke();
  ctx.rotate(spin.fan); ctx.fillStyle = fanSpeed > .1 ? "rgba(200,215,230,.75)" : "#5a6573";
  for (let k = 0; k < 5; k++) { ctx.rotate(Math.PI * 2 / 5); ctx.beginPath(); ctx.ellipse(32, 0, 30, 11, .4, 0, 7); ctx.fill(); }
  ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill(); ctx.restore();
  label("fan " + (P("cooling-fan", "on", false) ? "on" : "off"), 1150, 320, { color: P("cooling-fan", "on", false) ? "#4fd18b" : undefined });
  // coolant temperature sensor on the head
  ctx.fillStyle = tempColor(P("coolant-temp-sensor", "value", 20)); ctx.beginPath(); ctx.arc(742, 120, 7, 0, 7); ctx.fill();

  // Fuel tank and pump, battery, fuse box, headlights along the bottom.
  const liters = P("fuel-tank", "liters", 0), cap = P("fuel-tank", "capacity", 45);
  const pumpOn = P("fuel-pump", "on", false), pumpP = P("fuel-pump", "pressure", 0);
  rr(800, 570, 150, 70, 10); ctx.fillStyle = "#1a1f26"; ctx.fill(); ctx.strokeStyle = "#3d4856"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = liters / cap < .1 ? "#b8792c" : "#a8953c"; ctx.fillRect(804, 636 - 62 * liters / cap, 142, 62 * liters / cap);
  wheel(925, 615, 11, pumpOn ? turn("fp", 3) : (spin.fp || 0), { spokes: 3, rim: pumpOn ? "#d9c34a" : "#4b5664" });
  label("fuel tank " + liters.toFixed(1) + " L", 806, 562); text("pump " + pumpP.toFixed(1) + " bar", 812, 604, { color: pumpOn ? "#d9c34a" : "#777" });


  const soc = P("battery", "soc", 0), volts = P("battery", "volts", 0), amps = P("battery", "amps", 0);
  rr(980, 572, 100, 66, 8); ctx.fillStyle = "#20262d"; ctx.fill(); ctx.strokeStyle = "#3d4856"; ctx.stroke();
  ctx.fillStyle = "#ff5d5d"; ctx.fillRect(990, 564, 14, 8); ctx.fillStyle = "#8b95a3"; ctx.fillRect(1056, 564, 14, 8);
  ctx.fillStyle = soc < .3 ? "#ff5d5d" : "#4fd18b"; ctx.fillRect(988, 624, 84 * soc, 8);
  text(volts.toFixed(1) + " V", 990, 600, { color: volts < 11.5 ? "#ff5d5d" : volts > 13.2 ? "#4fd18b" : "#e6e9ee", size: 16, weight: 700 });
  text((amps >= 0 ? "+" : "") + amps.toFixed(0) + " A", 990, 617, { color: amps >= 0 ? "#4fd18b" : "#ffb547" });
  label("battery " + Math.round(soc * 100) + "%", 982, 560);

  const on = P("fuse-box", "on", {}) || {}, circuits = ["ignition", "starter", "fuel-pump", "cooling-fan", "ac-compressor", "headlights"];
  rr(1100, 572, 160, 66, 8); ctx.fillStyle = "#20262d"; ctx.fill(); ctx.strokeStyle = "#3d4856"; ctx.stroke();
  circuits.forEach((c, k) => {
    const x = 1110 + (k % 3) * 50, y = 584 + Math.floor(k / 3) * 28;
    ctx.fillStyle = on[c] ? "#4fd18b" : "#3a424c"; ctx.beginPath(); ctx.arc(x + 4, y + 2, 4, 0, 7); ctx.fill();
    text(c.replace("cooling-", "").replace("ac-compressor", "a/c").replace("fuel-pump", "fuel").replace("headlights", "lights").replace("ignition", "ign"), x + 11, y + 6, { size: 10, color: on[c] ? "#e6e9ee" : "#6b7583" });
  });
  label("fuse box · " + P("fuse-box", "load", 0).toFixed(0) + " A", 1102, 560);

  const bright = P("headlights", "brightness", 0);
  if (bright > 0) { glow(1240, 470, 90, "rgba(255,248,210,ALPHA)", .45 * bright); }
  ctx.fillStyle = bright > 0 ? mix([90, 90, 80], [255, 250, 220], bright) : "#3a424c"; ctx.beginPath(); ctx.arc(1240, 470, 16, 0, 7); ctx.fill();
  label("lights", 1222, 500);
}

function convexHull(points) {
  points.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of points) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  for (const p of points.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

// ---------- the instrument cluster ----------
function gauge(x, y, r, value, min, max, o) {
  const a0 = Math.PI * .75, a1 = Math.PI * 2.25, t = clamp((value - min) / (max - min), 0, 1);
  ctx.lineCap = "butt";
  ctx.strokeStyle = "#232a33"; ctx.lineWidth = r * .14; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
  (o.bands || []).forEach(([from, to, color]) => {
    ctx.strokeStyle = color; ctx.beginPath();
    ctx.arc(x, y, r, a0 + (a1 - a0) * (from - min) / (max - min), a0 + (a1 - a0) * (to - min) / (max - min)); ctx.stroke();
  });
  ctx.strokeStyle = "#5a6573"; ctx.lineWidth = 2;
  for (let k = 0; k <= (o.ticks || 4); k++) {
    const a = a0 + (a1 - a0) * k / (o.ticks || 4);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * .78, y + Math.sin(a) * r * .78); ctx.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); ctx.stroke();
    if (o.tickLabel) text(o.tickLabel(min + (max - min) * k / (o.ticks || 4)), x + Math.cos(a) * r * .64, y + Math.sin(a) * r * .64 + 4, { align: "center", size: 11, color: "#8b95a3" });
  }
  const a = a0 + (a1 - a0) * t;
  ctx.strokeStyle = o.needle || "#ff6b3d"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * r * .1, y - Math.sin(a) * r * .1); ctx.lineTo(x + Math.cos(a) * r * .86, y + Math.sin(a) * r * .86); ctx.stroke();
  ctx.fillStyle = "#3a424c"; ctx.beginPath(); ctx.arc(x, y, r * .08 + 3, 0, 7); ctx.fill();
  text(o.value, x, y + r * .48, { align: "center", size: o.big ? 22 : 15, weight: 700, color: "#e6e9ee" });
  label(o.name, x, y + r * .48 + 15, { align: "center" });
}

function lamp(x, y, name, on, color) {
  rr(x, y, 84, 26, 6); ctx.fillStyle = on ? color : "#1c2229"; ctx.fill();
  if (on) glow(x + 42, y + 13, 50, color.replace("rgb", "rgba").replace(")", ",ALPHA)"), .25);
  text(name, x + 42, y + 17, { align: "center", size: 11, weight: 700, color: on ? "#111" : "#4a535e" });
}

function drawCluster() {
  const y0 = 666;
  rr(10, y0 - 14, W - 20, H - y0 + 6, 16); ctx.fillStyle = "#0d1014"; ctx.fill(); ctx.strokeStyle = "#232a33"; ctx.lineWidth = 2; ctx.stroke();
  const c = (k, d) => P("instrument-cluster", k, d);
  const status = c("status", { rpm: 0, mode: "off" }), coolant = c("coolant", 20), oil = c("oil", 0), volts = c("volts", 12.5);
  const fuel = c("fuel", 0), lam = c("lambda", { lambda: 0, ready: false }), map = c("map", 1);
  const rpm = running() ? status.rpm : 0, mode = running() ? status.mode : "off";
  gauge(640, y0 + 80, 82, rpm, 0, 8000, { name: "rpm", value: Math.round(rpm), big: true, ticks: 8, tickLabel: (v) => v / 1000, bands: [[6500, 8000, "#7a2323"]] });
  gauge(400, y0 + 80, 56, coolant, 40, 130, { name: "coolant °C", value: coolant.toFixed(0), ticks: 3, tickLabel: (v) => v.toFixed(0), bands: [[110, 130, "#7a2323"]], needle: "#4aa8ff" });
  gauge(255, y0 + 80, 56, oil, 0, 5, { name: "oil bar", value: oil.toFixed(1), ticks: 5, tickLabel: (v) => v.toFixed(0), bands: [[0, .5, "#7a2323"]], needle: "#d4a640" });
  gauge(880, y0 + 80, 56, volts, 8, 16, { name: "volts", value: volts.toFixed(1), ticks: 4, tickLabel: (v) => v.toFixed(0), bands: [[8, 11.5, "#7a2323"]], needle: "#4fd18b" });
  gauge(1025, y0 + 80, 56, fuel * 100, 0, 100, { name: "fuel %", value: Math.round(fuel * 100), ticks: 4, tickLabel: (v) => ["E", "", "½", "", "F"][Math.round(v / 25)], bands: [[0, 10, "#7a2323"]], needle: "#d9c34a" });
  gauge(110, y0 + 80, 56, map * 100, 0, 100, { name: "manifold kPa", value: Math.round(map * 100), ticks: 4, tickLabel: (v) => v.toFixed(0), needle: "#7fb6ff" });

  // lambda bar
  const lx = 1110, ly = y0 + 18;
  label("lambda", lx, ly); rr(lx, ly + 6, 150, 12, 6); ctx.fillStyle = "#232a33"; ctx.fill();
  ctx.fillStyle = "#3a424c"; ctx.fillRect(lx + 74, ly + 4, 2, 16);
  if (lam.ready) { const x = lx + clamp((lam.lambda - .7) / .6, 0, 1) * 150; ctx.fillStyle = Math.abs(lam.lambda - 1) < .05 ? "#4fd18b" : "#ffb547"; ctx.beginPath(); ctx.arc(x, ly + 12, 7, 0, 7); ctx.fill(); }
  text(!lam.ready ? "sensor cold" : lam.lambda > 1.5 ? "fuel cut" : lam.lambda.toFixed(2) + (lam.lambda < .97 ? " rich" : lam.lambda > 1.03 ? " lean" : ""), lx, ly + 38, { color: "#e6e9ee", weight: 700 });
  // pedal and throttle bars
  const px = 1112, py = y0 + 82;
  label("pedal", px, py); label("throttle", px + 76, py);
  [[px, snap.driver.pedal, "#4fd18b"], [px + 76, P("throttle-body", "opening", 0), "#ffb547"]].forEach(([x, v, col]) => {
    rr(x, py + 6, 64, 10, 5); ctx.fillStyle = "#232a33"; ctx.fill(); ctx.fillStyle = col; ctx.fillRect(x, py + 6, 64 * v, 10);
    text(Math.round(v * 100) + "%", x, py + 32, { color: "#e6e9ee", weight: 700 });
  });

  // warning lamps
  const lamps = [
    ["CHECK", status.checkEngine, "rgb(255,181,71)"], ["OIL", running() && oil < .5, "rgb(255,93,93)"],
    ["BATT", volts < 12.2 && running(), "rgb(255,93,93)"], ["TEMP", coolant > 110, "rgb(255,93,93)"],
    ["FAN", P("cooling-fan", "on", false), "rgb(79,209,139)"], ["A/C", P("ac-compressor", "engaged", false), "rgb(95,212,255)"],
    ["LOW FUEL", fuel < .1, "rgb(255,181,71)"], ["LIGHTS", P("headlights", "on", false), "rgb(79,209,139)"],
    ["STARTER", P("starter", "engaged", false), "rgb(255,181,71)"], ["REV LIMIT", mode === "rev limit", "rgb(255,93,93)"],
  ];
  lamps.forEach(([n, on, col], k) => lamp(30 + k * 92, y0 + 168 - 20, n, !!on, col));
  text("mode: " + (running() ? mode : "stopped"), 960, y0 + 166, { color: "#e6e9ee", weight: 700, size: 13 });
}

// ---------- the frame ----------
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  tickPedal(dt); tickSound();
  const scale = Math.min(canvas.clientWidth / W, 4) * (window.devicePixelRatio || 1);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = "#0c0f13"; ctx.fillRect(0, 0, W, H);
  if (snap) {
    const a = advanceAngle(dt);
    drawEngine(a); drawFront(a, dt); drawCluster();
    text(`stroke ${Math.max(0, P("crankshaft", "crank", {}).stroke || 0)} · ${snap.cyclesPerStroke.toFixed(1)} mesh cycles per stroke`, 1262, 18, { align: "right", size: 11, color: "#6b7583" });
    if (snap.scale < 1) text(snap.scale >= .25 ? "¼ speed" : "slow motion", 20, 640, { color: "#ffb547", weight: 700, size: 13 });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
